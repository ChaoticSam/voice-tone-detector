services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # No published port -- only api/worker (on the compose network) need to reach it;
    # Redis has no auth by default, so it must never be exposed to the internet.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Still published directly too (unauthenticated HTTP) -- fine for now while testing;
    # tighten to internal-only once HTTPS-via-Caddy is confirmed working end-to-end.
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
    # Scale with: docker compose up -d --scale worker=N (N bounded by RAM, ~2-3GB/worker
    # for its loaded models).

volumes:
  redis_data:
  uploads:      # shared between api (writes) and worker (reads by path) -- must be the
                # same volume, not per-service, since the worker is handed a file path the
                # api saved.
  hf_cache:     # model weights persist across restarts -- avoids re-downloading gigabytes
                # (WhisperX, pyannote, the two SER models, AST) every time a container starts.
  caddy_data:   # Let's Encrypt cert + key -- must persist, or every restart re-issues a
                # cert and can hit Let's Encrypt's rate limits.
  caddy_config:
